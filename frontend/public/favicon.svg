<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="note-grad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="45%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="12" y1="3" x2="20" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7DD3FC"/>
      <stop offset="100%" stopColor="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Modern dark rounded container -->
  <rect width="32" height="32" rx="7" fill="url(#favicon-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#334155" stroke-opacity="0.8"/>

  <!-- Punto de la 'i' (Resonancia armónica / cabeza) -->
  <circle cx="16" cy="7.2" r="2.8" fill="url(#dot-grad)"/>
  <circle cx="15.2" cy="6.4" r="0.8" fill="#FFFFFF" opacity="0.8"/>

  <!-- Cabeza de la nota en la base (inclinada) -->
  <ellipse cx="12.2" cy="22.2" rx="4.2" ry="3.1" transform="rotate(-24 12.2 22.2)" fill="url(#note-grad)"/>

  <!-- Mástil vertical de la 'i' -->
  <rect x="14.8" y="11.6" width="2.8" height="10.8" rx="1.4" fill="url(#note-grad)"/>

  <!-- Bandera musical / Corchea superior -->
  <path d="M17.6 11.6C20.4 12.0 23.6 13.8 23.9 16.8C24.0 17.6 23.1 18.2 22.3 17.6C20.6 16.2 18.9 15.4 17.6 15.2V11.6Z" fill="url(#note-grad)"/>
</svg>